<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Negarit ET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(120% 120% at 50% 0%, #161B22 0%, #0A0D12 100%);
            min-height: 100vh;
        }
        .fluent-acrylic-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.65);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-slate-100 p-4">

    <div class="fluent-acrylic-card w-full max-w-md rounded-2xl p-8">
        <div class="text-center mb-6">
            <a href="/showcase" class="inline-flex items-center gap-1.5 text-xs text-[#2CB34A] hover:text-[#4CD66C] transition-colors mb-3">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Public Showcase
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Log In</h1>
        </div>

        <form id="login-form" class="space-y-6">
            <div id="error-message" class="hidden bg-[#EF373E]/10 border border-[#EF373E]/50 text-[#EF373E] px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span id="error-text">Invalid credentials</span>
            </div>

            <div class="space-y-2">
                <label for="username" class="block text-sm font-medium text-slate-300">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="username" name="username" required
                        class="block w-full pl-10 pr-3 py-2.5 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#2CB34A] focus:border-transparent transition-all"
                        placeholder="Enter your username">
                </div>
            </div>

            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="block w-full pl-10 pr-10 py-2.5 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#2CB34A] focus:border-transparent transition-all"
                        placeholder="••••••••">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white focus:outline-none">
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-[#2CB34A] hover:bg-[#23953C] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#2CB34A] focus:ring-offset-slate-900 transition-colors">
                <span>Sign In</span>
            </button>

            <!-- Quick Demo Accounts -->
            <div class="pt-4 border-t border-slate-700/60">
                <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 text-center">Quick Demo Login</div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillDemo('selam.alemu')" class="p-2 rounded bg-[#2CB34A]/15 border border-[#2CB34A]/30 text-[#4CD66C] hover:bg-[#2CB34A]/25 text-left transition-colors">
                        <div class="font-bold">Super Admin</div>
                        <div class="text-[10px] text-slate-400">selam.alemu</div>
                    </button>
                    <button type="button" onclick="fillDemo('meron.tesfaye')" class="p-2 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-500/25 text-left transition-colors">
                        <div class="font-bold">Gov Official</div>
                        <div class="text-[10px] text-slate-400">meron.tesfaye</div>
                    </button>
                    <button type="button" onclick="fillDemo('dawit.bekele')" class="p-2 rounded bg-[#EF373E]/15 border border-[#EF373E]/30 text-[#F86B71] hover:bg-[#EF373E]/25 text-left transition-colors">
                        <div class="font-bold">Agency Op</div>
                        <div class="text-[10px] text-slate-400">dawit.bekele</div>
                    </button>
                    <button type="button" onclick="fillDemo('abebe.kebede')" class="p-2 rounded bg-amber-500/15 border border-amber-500/30 text-amber-300 hover:bg-amber-500/25 text-left transition-colors">
                        <div class="font-bold">Reporter</div>
                        <div class="text-[10px] text-slate-400">abebe.kebede</div>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="mt-8 text-center text-sm text-slate-500">
        &copy; 2026 Negarit ET &mdash; Ethiopia National Disaster Intelligence
    </div>

    <script>
        lucide.createIcons();

        const form = document.getElementById('login-form');
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const eyeIcon = document.getElementById('eye-icon');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');

        function fillDemo(username) {
            usernameInput.value = username;
            passwordInput.value = 'negarit2026';
            errorDiv.classList.add('hidden');
        }

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            lucide.createIcons();

            const formData = new FormData();
            formData.append('username', usernameInput.value.trim());
            formData.append('password', passwordInput.value.trim());
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorText.textContent = data.detail || 'Invalid username or password';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span>';
            }
        });
    </script>
</body>
</html>
